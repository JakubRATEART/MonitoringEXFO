<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <title>Monitorowanie Wersji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
  </head>
  <body>
    <main class="app-container py-3 py-md-4">
      <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom-subtle">
        <nav class="d-flex gap-2">
          <button id="refreshBtn" class="btn btn-outline-primary">Odśwież status</button>
        </nav>
        <div class="text-end header-branding">
          <img src="/static/Rateart_logo_2021_white.png" alt="Rateart Logo" class="header-logo">
          <div class="author-credit">by: Jakub Rogowski</div>
        </div>
      </header>

      <section id="cards"></section>

      <footer id="status-bar" class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top-subtle">
        <div class="text-muted small"></div>
        <div id="last-update" class="text-muted small">ostatnie sprawdzanie: --:-- <span class="sync-dot sync-unknown"></span></div>
      </footer>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
